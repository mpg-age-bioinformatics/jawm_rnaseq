# an hpc yaml rnaseq
- scope: global
  environment: "apptainer"
  automated_mount: False
  environment_apptainer: { "-B":"/nexus:/nexus" }
  manager: slurm
  manager_slurm: { "-p":"cluster,dedicated" }
  # before_script: "module load apptainer"
  # manager_slurm: {"--ntasks-per-core":"2", "-p":"general,small" }
  parallel: True
  var:
    # groups:
    #   SRR10544927;N2_OP50\n
    #   SRR10544928;rnp6_OP50\n
    #   SRR10544929;N2\n
    #   SRR10544930;rnp6\n
    #   SRR10544931;N2_OP50\n
    #   SRR10544932;rnp6_OP50\n
    #   SRR10544933;N2\n
    #   SRR10544934;rnp6\n
    #   SRR10544935;N2_OP50\n
    #   SRR10544936;rnp6_OP50\n
    #   SRR10544937;N2\n
    #   SRR10544938;rnp6
    
    # map.source_folder: "./test/test-input"
    organism: "caenorhabditis_elegans"
    groups: |
      N2.Rep_1.READ_1.fastq.gz;;N2_untreated
      N2.Rep_2.READ_1.fastq.gz;;N2_untreated
      N2.Rep_3.READ_1.fastq.gz;;N2_untreated
      daf2.Rep_1.READ_1.fastq.gz;;daf2_untreated
      daf2.Rep_2.READ_1.fastq.gz;;daf2_untreated
      daf2.Rep_3.READ_1.fastq.gz;;daf2_untreated
      N2_treated.Rep_1.READ_1.fastq.gz;;N2_treated
      N2_treated.Rep_2.READ_1.fastq.gz;;N2_treated
      N2_treated.Rep_3.READ_1.fastq.gz;;N2_treated
      daf2_treated.Rep_1.READ_1.fastq.gz;;daf2_treated
      daf2_treated.Rep_2.READ_1.fastq.gz;;daf2_treated
      daf2_treated.Rep_3.READ_1.fastq.gz;;daf2_treated

- scope: process
  name: 
    - download_link
    - read_acc
    - download_gtf
    - download_dna
    - get_erccs
  manager: local

- scope: process
  name: fastqc
  var:
    cpus: 4

- scope: process
  name: 
    - unstranded_mapping
    - mapping
    - geneid
    - biotype
  var:
    cpus: 12