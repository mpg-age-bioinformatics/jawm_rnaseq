# an hpc yaml rnaseq
- scope: global
  environment: "apptainer"
  environment_apptainer: { "-B":"/nexus:/nexus" }
  manager: slurm
  manager_slurm: { "-p":"cluster,dedicated" }

- scope: process
  name: 
    - read_acc
    - download_gtf
    - download_dna
    - get_erccs
  manager: local

- scope: process
  name: fastqc
  var:
    ncores: 4

- scope: process
  name: 
    - unstranded_mapping
    - mapping
    - geneid
    - biotype
  var:
    cpus: 12