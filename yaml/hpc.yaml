# an hpc yaml rnaseq
- scope: global
  environment: "apptainer"
  automated_mount: False
  environment_apptainer: { "-B":"/nexus:/nexus" }
  manager: slurm
  manager_slurm: { "-p":"cluster,dedicated" }
  # before_script: "module load apptainer"
  # manager_slurm: {"--ntasks-per-core":"2", "-p":"general,small" }
  parallel: True

- scope: process
  name: 
    - download_link
    - read_acc
    - download_gtf
    - download_dna
    - get_erccs
  manager: local

- scope: process
  name: fastqc
  var:
    ncores: 4

- scope: process
  name: 
    - unstranded_mapping
    - mapping
    - geneid
    - biotype
  var:
    cpus: 12